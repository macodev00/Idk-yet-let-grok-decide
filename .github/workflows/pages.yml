name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/src
          cp index.html _site/
          cp src/*.js src/styles.css _site/src/
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - name: Explain how to turn the site on
        if: steps.pages.outcome != 'success'
        run: echo "Pages is not enabled yet. In the repository settings, set Pages to GitHub Actions, then re-run this workflow."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success'
        with:
          path: _site
      - id: deployment
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
