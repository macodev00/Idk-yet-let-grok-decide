name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - run: node scripts/build-standalone.js
      - name: Publish the single-file build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/whencanwe.html \
            --title "${GITHUB_REF_NAME}" \
            --notes "Open whencanwe.html in a browser. It runs offline and does not upload the plan."
